name: Android build

# Builds a signed Piverxy.apk and publishes it to the rolling "android-latest" release.
# Signed with the same release key every time (GitHub secrets), so new builds install as updates.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle
        run: node mobile/build.mjs

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Build signed APK
        env:
          PIVERXY_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PIVERXY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PIVERXY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PIVERXY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PIVERXY_VERSION_CODE: ${{ github.run_number }}
        run: |
          test -n "$PIVERXY_KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$PIVERXY_KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$PIVERXY_KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          test -n "$PIVERXY_KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          printf '%s' "$PIVERXY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/piverxy-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/piverxy-release.p12" -storetype PKCS12 \
            -storepass "$PIVERXY_KEYSTORE_PASSWORD" -alias "$PIVERXY_KEY_ALIAS" >/dev/null
          export PIVERXY_KEYSTORE="$RUNNER_TEMP/piverxy-release.p12"
          export PIVERXY_VERSION_NAME="$(node -p "require('./package.json').version")"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Piverxy.apk
          ls -lh ../Piverxy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Piverxy-apk
          path: Piverxy.apk

      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # only the newest commit on main replaces the public build (a re-run of an older run would
          # otherwise put an older build back, which Android refuses to install over the newer one)
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then echo "main is at ${head::7} now; not publishing ${GITHUB_SHA::7}"; exit 0; fi
          # website adds this to the new file's count). 3530 = downloads counted before this existed
          ver="$(node -p "require('./package.json').version")"
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest Piverxy.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Piverxy for Android (latest build)" \
            --notes "Piverxy $ver. Build of ${GITHUB_SHA::7} (run ${{ github.run_number }}). Download Piverxy.apk on your phone and open it to install. Allow installs from your browser/files app if Android asks.<!-- muriel-version: $ver -->"
